name: Build HPPD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        include:
          - platform: Win32
            arch: x86
          - platform: x64
            arch: x64

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Restore NuGet packages
      run: nuget restore HPPD.sln

    - name: Build ${{ matrix.arch }} Release
      run: |
        msbuild HPPD.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143

    - name: Upload ${{ matrix.arch }} artifact
      uses: actions/upload-artifact@v4
      with:
        name: HPPD-${{ matrix.arch }}
        path: HPPD/Release${{ matrix.platform == 'x64' && '_x64' || '' }}/HPPD.exe
        if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
